<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>GCD Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at 50% 0%, #e6edff 0, transparent 48%),
        #f5f7fb;
    }

    main { width: min(100%, 720px); margin: 0 auto; }

    .eyebrow {
      margin: 0 0 10px;
      color: #5369c5;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3rem);
      letter-spacing: -.045em;
      text-align: center;
    }

    .intro {
      max-width: 520px;
      margin: 12px auto 30px;
      color: #647089;
      line-height: 1.6;
      text-align: center;
    }

    .card {
      padding: clamp(22px, 5vw, 36px);
      border: 1px solid #e3e8f2;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgb(31 49 92 / 9%);
    }

    .inputs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #34415d;
      font-size: .9rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      min-height: 52px;
      padding: 0 14px;
      border: 1px solid #cfd6e5;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: #172033;
      font: inherit;
      font-size: 1.05rem;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #5369c5;
      box-shadow: 0 0 0 3px rgb(83 105 197 / 16%);
    }

    .and {
      padding-bottom: 15px;
      color: #8b95a9;
      font-weight: 650;
    }

    button {
      min-height: 48px;
      padding: 0 19px;
      border: 0;
      border-radius: 10px;
      background: #5369c5;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: background .15s, transform .15s;
    }

    button:hover { background: #4358b2; }
    button:active { transform: translateY(1px); }
    button:focus-visible, .examples button:focus-visible {
      outline: 3px solid #97a8ff;
      outline-offset: 3px;
    }

    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .actions button:first-child { flex: 1; }
    .actions .secondary {
      border: 1px solid #d5dbea;
      background: #fff;
      color: #34415d;
    }
    .actions .secondary:hover { background: #f6f8fc; }

    .message {
      min-height: 24px;
      margin: 12px 0 0;
      color: #b42318;
      font-size: .9rem;
    }

    .result {
      display: none;
      margin-top: 18px;
      padding: 20px;
      border: 1px solid #dce5ff;
      border-radius: 12px;
      background: #f6f8ff;
    }
    .result.visible { display: block; }
    .result-label {
      margin: 0 0 4px;
      color: #647089;
      font-size: .85rem;
      font-weight: 650;
    }
    .answer {
      margin: 0;
      color: #334aab;
      font-size: clamp(1.8rem, 7vw, 2.5rem);
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    details {
      margin-top: 18px;
      border-top: 1px solid #e4e8f1;
      padding-top: 16px;
    }
    summary {
      color: #34415d;
      cursor: pointer;
      font-weight: 700;
    }
    .steps {
      margin: 12px 0 0;
      padding-left: 24px;
      color: #59657d;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .9rem;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .examples {
      margin-top: 22px;
      color: #647089;
      font-size: .88rem;
      line-height: 1.8;
      text-align: center;
    }
    .examples strong { color: #34415d; }
    .examples button {
      min-height: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: #4358b2;
      font: inherit;
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .examples button:hover { background: transparent; color: #263c98; }

    .note {
      margin: 22px 0 0;
      color: #778198;
      font-size: .82rem;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 520px) {
      body { padding: 32px 16px; }
      .inputs { grid-template-columns: 1fr; gap: 12px; }
      .and { display: none; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Euclidean algorithm</p>
    <h1>GCD Calculator</h1>
    <p class="intro">Find the greatest common divisor of two integers and follow each step of the calculation.</p>

    <section class="card" aria-label="Greatest common divisor calculator">
      <form id="gcd-form" novalidate>
        <div class="inputs">
          <div>
            <label for="number-a">First integer</label>
            <input id="number-a" name="number-a" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 48" aria-describedby="input-message">
          </div>
          <span class="and" aria-hidden="true">and</span>
          <div>
            <label for="number-b">Second integer</label>
            <input id="number-b" name="number-b" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 18" aria-describedby="input-message">
          </div>
        </div>
        <p class="message" id="input-message" role="alert" aria-live="polite"></p>
        <div class="actions">
          <button type="submit">Find the GCD</button>
          <button class="secondary" id="clear-button" type="button">Clear</button>
        </div>
      </form>

      <section class="result" id="result" aria-live="polite" aria-atomic="true">
        <p class="result-label">Greatest common divisor</p>
        <p class="answer" id="answer"></p>
        <details open>
          <summary>Calculation steps</summary>
          <ol class="steps" id="steps"></ol>
        </details>
      </section>

      <div class="examples">
        <strong>Try an example:</strong>
        <button type="button" data-a="48" data-b="18">48 and 18</button>
        ·
        <button type="button" data-a="270" data-b="192">270 and 192</button>
        ·
        <button type="button" data-a="0" data-b="42">0 and 42</button>
      </div>
    </section>
    <p class="note">Accepts positive, negative, and zero integers of any size. By convention, gcd(0, 0) is 0.</p>
  </main>

  <script>
    "use strict";

    const form = document.querySelector("#gcd-form");
    const inputA = document.querySelector("#number-a");
    const inputB = document.querySelector("#number-b");
    const message = document.querySelector("#input-message");
    const result = document.querySelector("#result");
    const answer = document.querySelector("#answer");
    const steps = document.querySelector("#steps");

    function gcdWithSteps(first, second) {
      let a = first < 0n ? -first : first;
      let b = second < 0n ? -second : second;
      const calculations = [];

      if (a === 0n && b === 0n) {
        calculations.push("gcd(0, 0) = 0 by convention.");
        return { gcd: 0n, calculations };
      }

      while (b !== 0n) {
        const remainder = a % b;
        calculations.push(`${a} = ${b} × ${a / b} + ${remainder}`);
        [a, b] = [b, remainder];
      }

      calculations.push(`The last non-zero remainder is ${a}.`);
      return { gcd: a, calculations };
    }

    function parseInteger(input, label) {
      const value = input.trim();
      if (!/^[+-]?\d+$/.test(value)) {
        throw new Error(`${label} must be a whole integer.`);
      }
      return BigInt(value);
    }

    function calculate(first, second) {
      const calculation = gcdWithSteps(first, second);
      answer.textContent = calculation.gcd.toString();
      steps.replaceChildren(...calculation.calculations.map((line) => {
        const item = document.createElement("li");
        item.textContent = line;
        return item;
      }));
      result.classList.add("visible");
      message.textContent = "";
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      result.classList.remove("visible");
      try {
        calculate(parseInteger(inputA.value, "First value"), parseInteger(inputB.value, "Second value"));
      } catch (error) {
        message.textContent = error.message;
      }
    });

    document.querySelector("#clear-button").addEventListener("click", () => {
      inputA.value = "";
      inputB.value = "";
      message.textContent = "";
      result.classList.remove("visible");
      inputA.focus();
    });

    document.querySelectorAll("[data-a][data-b]").forEach((button) => {
      button.addEventListener("click", () => {
        inputA.value = button.dataset.a;
        inputB.value = button.dataset.b;
        form.requestSubmit();
      });
    });
  </script>
</body>
</html>
